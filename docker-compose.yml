version: "3.9"

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  bot:
    image: node:20-alpine
    working_dir: /app/bot
    volumes:
      - ./bot:/app/bot
    command: sh -c "npm install && npm run dev"
    environment:
      - REDIS_URL=redis://redis:6379
    env_file:
      - .env
    depends_on:
      - redis
